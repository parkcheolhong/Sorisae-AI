name: feature-engine-isolation-gate

on:
    pull_request:
    push:
        branches:
            - main
    workflow_dispatch:

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
    feature-engine-isolation-gate:
        name: feature-engine-isolation-gate / feature-engine-isolation-gate
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.13"

            - name: Run feature engine isolation gate
              run: |
                  python scripts/check_feature_engine_isolation.py
