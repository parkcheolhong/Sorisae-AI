  uploads/**,\
  docs/worldlinco-v2/assets/**,\
  docs/worldlinco-v2/captures/**,\
  frontend/frontend/.next-build/**,\
  frontend/frontend/app/**/dist/**,\
  frontend/frontend/lib/dist/**,\
  frontend/frontend/shared/dist/**,\
  frontend/frontend/tests/dist/**,\
  apps/daytrade-ai/**,\
  scripts/ui_api_failure_split_*/**,\
  scripts/ui_api_har_quickcheck/**,\
  **/*.apk,\
  **/*.png,\
  **/*.jpg,\
  **/*.jpeg,\
  **/*.gif,\
  **/*.pdf,\
  **/*.pptx
