# daytrade-ai — QuickFIX/N(또는 QuickFIX/J·QuickFIX/Python) 이니시에이터 세션 설정 템플릿.
#
# 설계서 §6(Order Router, FIX/FAST). 실거래 연동 시 이 설정으로 세션을 띄우고,
# daytrade.execution.fix.build_new_order_single() 로 만든 NewOrderSingle(35=D)을 송신,
# ExecutionReport(35=8)를 parse_execution_report() 로 파싱한다.
#
# 보안: 실거래는 파이프라인 이중 안전 게이트(LIVE 모드 + DAYTRADE_ALLOW_LIVE 토큰)가
# 충족돼야만 활성화된다. 자격증명/엔드포인트는 환경변수·시크릿 매니저로 주입할 것(아래는 예시).

[DEFAULT]
ConnectionType=initiator
ReconnectInterval=5
HeartBtInt=30
FileStorePath=store/fix
FileLogPath=log/fix
StartTime=00:00:00
EndTime=00:00:00          # 00:00:00=24h 세션(스캘핑 상시)
UseDataDictionary=Y
DataDictionary=spec/FIX44.xml
ResetOnLogon=Y
ResetOnLogout=Y
ResetOnDisconnect=Y
ValidateUserDefinedFields=N
# mTLS(권장): 거래소/브로커 요구 시 TLS 활성화.
SocketUseSSL=Y
SocketKeyStore=secrets/client.p12
# SocketKeyStorePassword 는 환경변수로 주입(파일에 평문 금지).

[SESSION]
BeginString=FIX.4.4
SenderCompID=DAYTRADE_CLIENT      # 환경에 맞게 교체
TargetCompID=BROKER_GATEWAY        # 브로커/거래소 CompID
SocketConnectHost=fix.broker.example.com
SocketConnectPort=9823
# 재전송/시퀀스: QuickFIX 엔진이 ResendRequest(2)/SequenceReset(4)로 자동 관리.
# 장애 복구 시 FileStore 의 시퀀스에서 재개(ResetOn* 정책에 따름).
