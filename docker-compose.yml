  # TURN 릴레이(coturn) — LTE/5G 장거리 통화 미디어 릴레이.
  # 왜: 통신사 CGNAT/대칭 NAT에서는 STUN만으론 P2P가 막혀 '같은 와이파이만 통화'가 된다.
  #     릴레이를 거쳐야 음성 미디어가 지역과 무관하게 흐른다.
  # 기본 `docker compose up` 에는 포함되지 않는다(호스트 포트 점유). 운영 서버에서:
  #   1) .env 에 TURN_SECRET, TURN_EXTERNAL_IP(이 서버 공인 IP) 설정
  #   2) 방화벽에서 3478/udp,tcp 와 미디어 레인지(기본 49160-49200/udp) 외부 공개
  #   3) `docker compose --profile turn up -d coturn backend`
  coturn:
    image: coturn/coturn:4.6
    container_name: devanalysis114-coturn
    profiles: ["turn"]
    restart: unless-stopped
    network_mode: host
    command:
      - -n
      - --log-file=stdout
      - --listening-port=${TURN_PORT:-3478}
      - --min-port=${TURN_MIN_PORT:-49160}
      - --max-port=${TURN_MAX_PORT:-49200}
      - --fingerprint
      # TURN_SECRET / TURN_EXTERNAL_IP 는 .env 에 반드시 설정(미설정 시 coturn 기동 실패 = 의도된 loud-fail).
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:-}
      - --realm=${TURN_DOMAIN:-metanova1004.com}
      - --external-ip=${TURN_EXTERNAL_IP:-}
      - --server-name=devanalysis114-coturn
      - --no-multicast-peers
      - --no-cli
      - --stale-nonce=600
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --total-quota=${TURN_TOTAL_QUOTA:-1200}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "(ss -lun 2>/dev/null || netstat -lun 2>/dev/null) | grep -q ':${TURN_PORT:-3478}' || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

